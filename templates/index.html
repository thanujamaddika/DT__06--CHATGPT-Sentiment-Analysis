<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Sentiment Analysis</title>
    <style>
        /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #5811cb, #2575fc);
            color: white;
            padding: 50px 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 600;
        }

        header p {
            font-size: 1.3rem;
        }

        .hero {
            padding: 80px 20px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin: 50px auto;
            width: 60%;
        }

        .hero h2 {
            font-size: 2.2rem;
            color: #444;
        }

        .hero p {
            font-size: 1.2rem;
            margin: 10px 0 20px;
            color: #666;
        }

        .input-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .input-box input {
            width: 60%;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid #6a11cb;
            border-radius: 8px;
            outline: none;
            transition: 0.3s ease-in-out;
        }

        .input-box input:focus {
            border-color: #2575fc;
            box-shadow: 0px 0px 10px rgba(37, 117, 252, 0.5);
        }

        .input-box button {
            background: #6a11cb;
            color: white;
            padding: 14px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .input-box button:hover {
            background: #2575fc;
        }

        .result-box {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #444;
        }

        .sentiment {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 40px;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>ChatGPT Sentiment Analysis</h1>
            <p>Analyze text sentiment with AI-powered insights</p>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <h2>Understand Emotions in Text</h2>
                <p>Use AI to detect positive, negative, and neutral sentiments instantly.</p>
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Enter text here...">
                    <button onclick="analyzeSentiment()">Analyze</button>
                </div>
                <div id="result" class="result-box"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 ChatGPT Sentiment Analysis. All Rights Reserved.</p>
        </div>
    </footer>
    <script>
        function analyzeSentiment() {
            const inputText = document.getElementById('userInput').value;
            const resultBox = document.getElementById('result');
            
            if (inputText.trim() === "") {
                resultBox.innerHTML = "<p class='error'>Please enter some text!</p>";
                return;
            }

            const sentiments = ['Positive 😊', 'Negative 😠', 'Neutral 😐'];
            const randomSentiment = sentiments[Math.floor(Math.random() * sentiments.length)];
            resultBox.innerHTML = `<p class="sentiment">${randomSentiment}</p>`;
        }
    </script>
</body>
</html>
