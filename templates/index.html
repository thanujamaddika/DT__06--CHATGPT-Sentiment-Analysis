<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        button {
            background: #ff9800;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s ease-in-out;
        }
        button:hover {
            transform: scale(1.1);
        }
        .output {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const button = document.getElementById("randomAction");
            const output = document.getElementById("output");
            const actions = [
                "Think positively!",
                "Smile and take a deep breath!",
                "Share a good memory!",
                "Tell a joke!",
                "Dance for 10 seconds!",
                "Send a thank-you message to someone!"
            ];
            
            button.addEventListener("click", function() {
                const randomIndex = Math.floor(Math.random() * actions.length);
                output.textContent = actions[randomIndex];
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>ChatGPT Sentiment Analysis</h1>
        <p>Analyze sentiment in real-time with AI</p>
        <button id="randomAction">Surprise Me!</button>
        <div class="output" id="output"></div>
    </div>
</body>
</html>
