<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Sentiment Analysis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f8;
            color: #333;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #5811cb, #2575fc);
            color: white;
            padding: 60px 20px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            border-bottom: 4px solid #333;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 600;
        }

        header p {
            font-size: 1.5rem;
        }

        .hero {
            padding: 80px 20px;
            background: white;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            margin: 40px auto;
            width: 70%;
            max-width: 800px;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
            color: #444;
        }

        .hero p {
            font-size: 1.3rem;
            margin: 15px 0 30px;
            color: #666;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .input-box button {
            background: #6a11cb;
            color: white;
            padding: 16px 24px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
            width: 60%;
        }

        .input-box button:hover {
            background: #2575fc;
            transform: scale(1.05);
        }

        footer {
            background: #222;
            color: white;
            padding: 25px;
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background: #2d2d2d;
            color: #eaeaea;
        }

        header.dark-mode {
            background: linear-gradient(135deg, #9c27b0, #3f51b5);
            border-bottom: 4px solid #eaeaea;
        }

        .hero.dark-mode {
            background: #444;
        }

        .input-box button.dark-mode {
            background: #9c27b0;
        }

        .input-box button.dark-mode:hover {
            background: #3f51b5;
        }

        footer.dark-mode {
            background: #121212;
        }

        .toggle-dark-mode {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #6a11cb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .toggle-dark-mode:hover {
            background: #2575fc;
        }
    </style>
</head>
<body>
    <button class="toggle-dark-mode" onclick="toggleDarkMode()">🌙</button>
    <header>
        <div class="container">
            <h1>ChatGPT Sentiment Analysis</h1>
            <p>Analyze text sentiment with AI-powered insights</p>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <h2>Start Your Sentiment Analysis</h2>
                <p>Click below to proceed to the sentiment prediction.</p>
                <div class="input-box">
                    <button onclick="redirectToPredict()">Predict Sentiment</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 ChatGPT Sentiment Analysis. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            document.querySelector('header').classList.toggle('dark-mode');
            document.querySelector('.hero').classList.toggle('dark-mode');
            document.querySelectorAll('.input-box button').forEach(button => button.classList.toggle('dark-mode'));
            document.querySelector('footer').classList.toggle('dark-mode');
        }

        function redirectToPredict() {
            window.location.href = "/predict";  // Redirect to /predict
        }
    </script>
</body>
</html>
